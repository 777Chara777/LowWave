<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LowWave 📻 | Radio</title>
    <style>
        :root {
            --bg-accent-1: #fed7aa;
            --bg-accent-2: #ffedd5; 
            --card-bg: rgba(255, 248, 240, 0.65);
            --card-border: rgba(255, 255, 255, 0.7);
            --text-primary: #2d1810;
            --text-secondary: #8c7365;
            --accent-color: #ff6b00;
            --blur-radius: 40px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.8s ease, border-color 0.8s ease, color 0.3s ease;
        }

        body {
            background-color: #fcf8f2;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 20% 20%, var(--bg-accent-1) 0%, transparent 60%),
                        radial-gradient(circle at 80% 80%, var(--bg-accent-2) 0%, transparent 60%);
            filter: blur(90px);
            opacity: 0.85;
        }

        .apple-container {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 36px;
            width: 100%;
            max-width: 1200px;
            min-height: 560px;
            background: var(--card-bg);
            backdrop-filter: blur(var(--blur-radius));
            -webkit-backdrop-filter: blur(var(--blur-radius));
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 36px;
            box-shadow: 0 30px 60px rgba(180, 80, 0, 0.06), 0 2px 6px rgba(0,0,0,0.02);
        }

        .player-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 20px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .badge-live {
            background: rgba(255, 107, 0, 0.12);
            color: var(--accent-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot-pulse {
            width: 7px;
            height: 7px;
            background: var(--accent-color);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .track-hero {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .cover-art {
            width: 220px;
            height: 220px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.5);
            overflow: hidden;
            box-shadow: 0 16px 36px rgba(100, 40, 0, 0.12);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
        }

        .cover-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-info h1 {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.8px;
            line-height: 1.15;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .track-info p {
            font-size: 19px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }

        .genre-pill {
            display: inline-block;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            border: 1px solid rgba(255,255,255,0.4);
        }

        .dj-transcript-card {
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 16px 20px;
        }

        .dj-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .dj-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--accent-color);
        }

        .dj-status-tag {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 8px;
            background: rgba(0,0,0,0.05);
            color: var(--text-secondary);
        }

        .dj-speech-text {
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-primary);
            font-weight: 500;
        }

        .queue-preview-card {
            background: rgba(255, 255, 255, 0.3);
            border: 1px dashed rgba(140, 115, 101, 0.2);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .queue-title {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .queue-track-name {
            font-weight: 700;
            color: var(--text-primary);
        }

        .lyrics-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            padding-left: 10px;
        }

        .lyrics-container {
            height: 150px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .lyrics-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .lyrics-container::-webkit-scrollbar {
            display: none;
        }

        .lyric-row {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            opacity: 0.3;
            line-height: 1.3;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            letter-spacing: -0.3px;
            min-height: 36px;
            display: flex;
            align-items: center;
        }

        .lyric-row.active {
            opacity: 1;
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-color);
            transform: scale(1.02);
            transform-origin: left;
        }

        .bottom-controls {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(140, 115, 101, 0.12);
            padding-top: 24px;
            margin-top: 8px;
            gap: 20px;
            position: relative;
        }

        .left-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-apple {
            background: var(--text-primary);
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-apple:hover {
            transform: scale(1.03);
        }

        .btn-apple:active {
            transform: scale(0.97);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .volume-icon {
            font-size: 14px;
            color: var(--text-secondary);
            user-select: none;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 90px;
            height: 5px;
            border-radius: 5px;
            background: rgba(140, 115, 101, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .search-container {
            position: relative;
            display: flex;
            gap: 10px;
        }

        .input-apple {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.08);
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 14px;
            outline: none;
            width: 280px;
            font-family: inherit;
            color: var(--text-primary);
        }

        .input-apple:focus {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.9);
        }

        .search-results-dropdown {
            position: absolute;
            bottom: calc(100% + 12px);
            right: 0;
            width: 380px;
            max-height: 280px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            display: none;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            z-index: 100;
        }

        .search-results-dropdown.active {
            display: flex;
        }

        .search-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.4);
            transition: background 0.2s;
        }

        .search-item:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        .search-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            padding-right: 10px;
        }

        .search-item-title {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-item-artist {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .btn-order-item {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        @media (max-width: 900px) {
            .apple-container {
                grid-template-columns: 1fr;
            }
            .lyrics-section {
                height: 260px;
            }
            .bottom-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .left-controls {
                justify-content: space-between;
            }
            .search-results-dropdown {
                width: 100%;
                right: 0;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-bg" id="ambient-bg"></div>

    <div class="apple-container">
        <div class="player-section">
            <div class="header-bar">
                <span>LOWWAVE RADIO</span>
                <div class="badge-live">
                    <div class="dot-pulse"></div> В ЭФИРЕ
                </div>
            </div>

            <div class="track-hero">
                <div class="cover-art" id="album-art-box">
                    <span>ОБЛОЖКА</span>
                </div>
                <div class="track-info">
                    <h1 id="track-title">Подключение...</h1>
                    <p id="artist-name">Загрузка радиопотока</p>
                    <div class="genre-pill" id="genre-tag">#LoFi & Ambient</div>
                </div>
            </div>

            <div class="dj-transcript-card">
                <div class="dj-header">
                    <span class="dj-label">🎙 Речь ведущего</span>
                    <span class="dj-status-tag" id="dj-status">ИИ Голос</span>
                </div>
                <div class="dj-speech-text" id="dj-text">«Загружаем волну LowWave... Приготовьтесь к эфиру.»</div>
            </div>

            <div class="queue-preview-card" id="queue-box">
                <span class="queue-title">Далее в эфире:</span>
                <span class="queue-track-name" id="next-track-name">Определение следующего трека...</span>
            </div>
        </div>

        <div class="lyrics-section">
            <div class="lyrics-title">Текст песни</div>
            <div class="lyrics-container" id="lyrics-container">
                <div class="lyric-row">[Инструментальная секция]</div>
                <div class="lyric-row active">Загрузка текста...</div>
                <div class="lyric-row">Синхронизация строки</div>
            </div>
        </div>

        <div class="bottom-controls">
            <div class="left-controls">
                <button class="btn-apple" id="play-btn" onclick="toggleAudio()">▶ Слушать эфир</button>
                
                <div class="volume-control">
                    <span class="volume-icon" id="vol-icon">🔊</span>
                    <input type="range" class="volume-slider" id="volume-range" min="0" max="1" step="0.01" value="0.8" oninput="changeVolume(this.value)">
                </div>
            </div>

            <div class="search-container">
                <input type="text" class="input-apple" id="song-input" placeholder="Песня или ссылка на плейлист..." oninput="handleSearchInput(this.value)">
                <button class="btn-apple" id="request-btn" style="background: var(--accent-color);" onclick="handleAction()">Заказать</button>
                
                <div class="search-results-dropdown" id="search-dropdown"></div>
            </div>
        </div>
    </div>

    <audio id="radio-player" preload="none"></audio>

    <script>
        let ws;
        let isPlaying = false;
        let searchTimeout = null;
        let currentLyrics = [];

        const player = document.getElementById('radio-player');
        const playBtn = document.getElementById('play-btn');
        const volSlider = document.getElementById('volume-range');
        const volIcon = document.getElementById('vol-icon');

        function changeVolume(val) {
            player.volume = val;
            localStorage.setItem('radio_volume', val);
            if (val == 0) volIcon.innerText = '🔇';
            else if (val < 0.5) volIcon.innerText = '🔉';
            else volIcon.innerText = '🔊';
        }

        function adaptThemeFromImage(imgElement) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 50;
            canvas.height = 50;

            try {
                ctx.drawImage(imgElement, 0, 0, 50, 50);
                const imageData = ctx.getImageData(0, 0, 50, 50).data;
                let r = 0, g = 0, b = 0, count = 0;

                for (let i = 0; i < imageData.length; i += 16) {
                    r += imageData[i];
                    g += imageData[i + 1];
                    b += imageData[i + 2];
                    count++;
                }

                r = Math.floor(r / count);
                g = Math.floor(g / count);
                b = Math.floor(b / count);

                document.documentElement.style.setProperty('--bg-accent-1', `rgb(${r}, ${g}, ${b})`);
                document.documentElement.style.setProperty('--bg-accent-2', `rgb(${Math.min(r + 40, 255)}, ${Math.max(g - 20, 0)}, ${Math.max(b - 40, 0)})`);
                document.documentElement.style.setProperty('--accent-color', `rgb(${Math.min(r + 60, 255)}, ${Math.max(g - 10, 0)}, ${Math.max(b - 50, 0)})`);
            } catch (e) {
                document.documentElement.style.setProperty('--bg-accent-1', '#fed7aa');
                document.documentElement.style.setProperty('--bg-accent-2', '#ffedd5');
                document.documentElement.style.setProperty('--accent-color', '#ff6b00');
            }
        }

        function toggleAudio() {
            if (!isPlaying) {
                player.src = "/stream?" + Date.now();
                player.play().then(() => {
                    isPlaying = true;
                    playBtn.innerText = "⏸ Пауза";
                });
            } else {
                player.pause();
                player.src = "";
                isPlaying = false;
                playBtn.innerText = "▶ Слушать эфир";
            }
        }

        function handleSearchInput(val) {
            clearTimeout(searchTimeout);
            const dropdown = document.getElementById('search-dropdown');
            
            if (!val.trim() || val.startsWith('http://') || val.startsWith('https://')) {
                dropdown.classList.remove('active');
                return;
            }

            searchTimeout = setTimeout(() => {
                if (ws?.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ action: 'search', query: val.trim() }));
                }
            }, 400);
        }

        function handleAction() {
            const input = document.getElementById('song-input');
            const val = input.value.trim();
            if (!val || ws?.readyState !== WebSocket.OPEN) return;

            if (val.startsWith('http://') || val.startsWith('https://')) {
                ws.send(JSON.stringify({ action: 'load_playlist', url: val }));
            } else {
                ws.send(JSON.stringify({ action: 'request', song: val }));
            }
            input.value = '';
            document.getElementById('search-dropdown').classList.remove('active');
        }

        function selectTrack(id) {
            if (ws?.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'request', song_id: id }));
                document.getElementById('song-input').value = '';
                document.getElementById('search-dropdown').classList.remove('active');
            }
        }

        function renderLyrics(lyrics) {
            const lyricsBox = document.getElementById('lyrics-container');
            lyricsBox.innerHTML = lyrics.map((item, idx) => {
                const text = typeof item === 'string' ? item : item.text;
                const time = typeof item === 'object' && item.time !== undefined ? item.time : idx * 4;
                return `<div class="lyric-row ${idx === 0 ? 'active' : ''}" data-time="${time}" id="lyric-line-${idx}">${text}</div>`;
            }).join('');
        }

        function updateActiveLyric(index) {
            const lines = document.querySelectorAll('.lyric-row');
            const targetLine = document.getElementById(`lyric-line-${index}`);

            if (targetLine && !targetLine.classList.contains('active')) {
                lines.forEach(row => row.classList.remove('active'));
                targetLine.classList.add('active');
                targetLine.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
            }
        }

        function connectWebSocket() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${window.location.host}/ws`);

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.track) {
                        document.getElementById('track-title').innerText = data.track.title || "Без названия";
                        document.getElementById('artist-name').innerText = data.track.artist || "Исполнитель";
                        if (data.track.cover_url) {
                            const img = new Image();
                            img.crossOrigin = "Anonymous";
                            img.src = data.track.cover_url;
                            img.onload = () => {
                                document.getElementById('album-art-box').innerHTML = '';
                                document.getElementById('album-art-box').appendChild(img);
                                adaptThemeFromImage(img);
                            };
                        }
                    }

                    if (data.lyrics && Array.isArray(data.lyrics)) {
                        currentLyrics = data.lyrics;
                        renderLyrics(currentLyrics);
                    }

                    if (data.search_results && Array.isArray(data.search_results)) {
                        const dropdown = document.getElementById('search-dropdown');
                        if (data.search_results.length > 0) {
                            dropdown.innerHTML = data.search_results.map(item => `
                                <div class="search-item">
                                    <div class="search-item-info">
                                        <span class="search-item-title">${item.title}</span>
                                        <span class="search-item-artist">${item.artist || 'Неизвестен'}</span>
                                    </div>
                                    <button class="btn-order-item" onclick="selectTrack('${item.id}')">Заказать</button>
                                </div>
                            `).join('');
                            dropdown.classList.add('active');
                        } else {
                            dropdown.classList.remove('active');
                        }
                    }

                    const djMsg = data.dj_comment ?? data.llm_message;
                    if (djMsg?.trim()) {
                        document.getElementById('dj-text').innerText = `«${djMsg}»`;
                    }
                    if (data.dj_status) {
                        document.getElementById('dj-status').innerText = data.dj_status;
                    }

                    if (data.next_track) {
                        document.getElementById('next-track-name').innerText = `${data.next_track.artist} — ${data.next_track.title}`;
                    }
                } catch (e) {
                    console.error("Ошибка WS:", e);
                }
            };

            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        player.addEventListener('timeupdate', () => {
            if (!currentLyrics.length) return;

            const currentTime = player.currentTime;
            let activeIndex = 0;

            for (let i = 0; i < currentLyrics.length; i++) {
                const itemTime = typeof currentLyrics[i] === 'object' ? currentLyrics[i].time : i * 4;
                if (currentTime >= itemTime) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            updateActiveLyric(activeIndex);
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                document.getElementById('search-dropdown').classList.remove('active');
            }
        });

        window.onload = () => {
            connectWebSocket();
            const savedVol = localStorage.getItem('radio_volume');
            if (savedVol !== null) {
                volSlider.value = savedVol;
                changeVolume(savedVol);
            }
        };
    </script>
</body>
</html>
